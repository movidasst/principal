name: Promote corporate offer at top

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize above-fold corporate banner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old='id="corporate-top-cta" class="shell mb-3 sm:mb-4"'
          new='id="corporate-top-cta" class="shell relative z-10 mb-3 sm:mb-4"'
          if old in t:
              t=t.replace(old,new,1)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'id="corporate-top-cta" class="shell relative z-10' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: keep corporate CTA above hero effects"
          git push
