name: Mi Movida · comprobación pública
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mi-movida/**'
      - '.github/workflows/mi-movida-live-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verificar rutas estáticas locales publicadas
        run: |
          test -s mi-movida/index.html
          test -s mi-movida/app.js
          test -s mi-movida/styles.css
          test -s mi-movida/icons.js
          test -s mi-movida/live.css
          test -s mi-movida/assets/icon.svg
          grep -q 'mi-movida-edge-api' mi-movida/index.html
          grep -q 'frame-src https://directorio.movidasst.com;' mi-movida/index.html
          node --check mi-movida/app.js
          node tests/mi-movida-certificados.mjs
          node tests/mi-movida-perfil-solo-lectura.mjs
      - name: Verificar que GitHub Pages publica la ruta
        run: |
          curl --fail --location --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors --max-time 12 https://www.movidasst.com/mi-movida/ | grep -q 'Mi Movida'
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --max-time 12 https://www.movidasst.com/mi-movida/app.js | grep -q 'geoCredentialUrl'
      - name: Comprobar API Edge sin identidades
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-delay 4 --max-time 12 https://lfdmbkzghnwvsapxypvt.supabase.co/functions/v1/mi-movida-api/health | grep -q edge_gateway_ready
