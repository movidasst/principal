name: Publish approved La Movida SST preview
on:
  push:
    paths:
      - '.github/workflows/install-og-movida-2026.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Prepare social image
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from urllib.request import Request, urlopen
          from io import BytesIO
          from pathlib import Path
          url = "https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2Fd96c7f01-9c63-4353-b1df-cd7b01273c3d/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAIBOlYk5oZEP8bNDTHRYN157Ndak_cQJ-Gs_Lx9KyNet&exp=1792575470&osig=AAAAAAAAAAAAAAAAAAAAAG-ZVIkDyBGwkO7efni1ujV-ZFu7Yhh4nvbo4S-DmdiR&signer=media-rpc&token=AAIAAU0AJGQ5NmM3ZjAxLTljNjMtNDM1My1iMWRmLWNkN2IwMTI3M2MzZAAAAAABoV3S-bByJ9SkoTX7Ae0WyvZWUUAGI8SXFKcjasxCR-nlvvGlCw&x-canva-quality=thumbnail"
          req = Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urlopen(req, timeout=25) as r: raw = r.read()
          image = Image.open(BytesIO(raw)).convert('RGB')
          print('Preview image source:', image.size, 'download bytes:', len(raw))
          if image.width < 150: raise RuntimeError('Invalid image')
          image = image.resize((1200,676), Image.Resampling.LANCZOS)
          image = image.filter(ImageFilter.UnsharpMask(radius=1.0, percent=65, threshold=3))
          target = Path('og-movida-sst-casimiro-casimira-2026.jpg')
          image.save(target, 'JPEG', quality=92, optimize=True, progressive=True, subsampling=0)
          print('Image ready:', target, target.stat().st_size)
          PY
      - name: Commit social preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og-movida-sst-casimiro-casimira-2026.jpg
          git commit -m 'Add Casimiro and Casimira homepage social preview' || exit 0
          git push
