name: Mi Movida · Supabase nativo aislado

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'staging/supabase/**'
      - 'backend/sql/**'
      - '.github/workflows/mi-movida-native.yml'

permissions:
  contents: read

jobs:
  native-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Prohibir vínculos remotos y referencias de producción
        run: |
          test ! -f staging/supabase/.branches/_current_branch
          test ! -d staging/supabase/.temp
          ! grep -R -l 'lfdmbkzghnwvsapxypvt' staging/supabase
      - name: Arrancar Supabase nativo efímero sin datos reales
        run: supabase start --workdir ./staging -x realtime,studio,analytics,vector,edge-runtime,imgproxy
      - name: Volver a aplicar migraciones y seed local
        run: supabase db reset --local --workdir ./staging
      - name: Estado del entorno
        run: supabase status --workdir ./staging
