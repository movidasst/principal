name: Mi Movida · pruebas sintéticas

on:
  pull_request:
    paths:
      - 'application/**'
      - 'backend/**'
      - 'staging/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mi-movida-tests.yml'
  push:
    branches:
      - codex/mi-movida-prototipo

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci --ignore-scripts
      - name: Validar sintaxis de componentes críticos
        run: |
          node --check application/public/app.js
          node --check application/server/app.mjs
          node --check application/server/security.mjs
      - name: Pruebas sintéticas de autenticación, SQL, XP, Moodle y permisos
        run: npm test
      - name: Preparar Mi Movida para GitHub Pages
        env:
          MM_EDGE_API_URL: https://lfdmbkzghnwvsapxypvt.supabase.co/functions/v1/mi-movida-api
        run: |
          npm run build:pages
          test -f mi-movida/index.html
          test -f mi-movida/app.js
          test -f mi-movida/styles.css
          grep -q 'mi-movida-edge-api' mi-movida/index.html
      - name: Guardar vista estática de revisión
        uses: actions/upload-artifact@v4
        with:
          name: mi-movida-pages-review
          path: mi-movida/
          retention-days: 7


  native-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Impedir configuración de proyecto remoto
        run: |
          test ! -d staging/supabase/.temp
          ! grep -R -l 'lfdmbkzghnwvsapxypvt' staging/supabase
      - name: Iniciar servicios nativos locales
        run: supabase start --workdir ./staging -x realtime,studio,analytics,vector,imgproxy
      - name: Verificar migraciones y seed desde cero
        run: supabase db reset --local --workdir ./staging
      - name: Validar respuesta Edge en runtime nativo
        run: |
          printf 'MM_ENABLE_MEMBER_LOGIN=true\nMM_ENABLE_MEMBER_READS=true\nMM_RATE_LIMIT_SECRET=%s\n' "$(openssl rand -hex 32)" > /tmp/mi-movida-edge.env
          supabase functions serve mi-movida-api --workdir ./staging --no-verify-jwt --env-file /tmp/mi-movida-edge.env > /tmp/mi-movida-edge.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:54321/functions/v1/mi-movida-api/health | grep -q edge_gateway_ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:54321/functions/v1/mi-movida-api/health | grep -q edge_gateway_ready
          code=$(curl -sS -o /tmp/private-response -w '%{http_code}' http://127.0.0.1:54321/functions/v1/mi-movida-api/api/me/profile)
          test "$code" = "503"
          # Con login habilitado pero sin JWT, el perfil no puede ser leído.
          test "$code" = "401"
          curl -sS -o /tmp/mm-login.json -H 'Origin: https://www.movidasst.com' -H 'Content-Type: application/json' -d '{"document":"DEMO001","member_code":"A1B2C"}' http://127.0.0.1:54321/functions/v1/mi-movida-api/api/session/bootstrap
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/mm-login.json','utf8'));if(!d.data?.access_token)throw Error('login did not create a valid session');fs.writeFileSync('/tmp/mm-jwt',d.data.access_token,{mode:0o600})"
          token="$(cat /tmp/mm-jwt)"
          curl -fsS -H "Authorization: Bearer $token" -H 'Origin: https://www.movidasst.com' http://127.0.0.1:54321/functions/v1/mi-movida-api/api/session > /tmp/mm-session.json
          node -e "const d=require('/tmp/mm-session.json');if(!d.data?.authenticated)throw Error('session did not validate')"
          curl -fsS -H "Authorization: Bearer $token" -H 'Origin: https://www.movidasst.com' http://127.0.0.1:54321/functions/v1/mi-movida-api/api/me/profile > /tmp/mm-profile.json
          node -e "const d=require('/tmp/mm-profile.json');if(!d.data?.nombres)throw Error('profile not linked')"


  edge-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testear gateway Edge sin servicios ni secretos
        run: deno test staging/supabase/functions/mi-movida-api/index_test.ts
