name: Mi Movida · pruebas sintéticas

on:
  pull_request:
    paths:
      - 'application/**'
      - 'backend/**'
      - 'staging/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mi-movida-tests.yml'
  push:
    branches:
      - codex/mi-movida-prototipo

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci --ignore-scripts
      - name: Validar sintaxis de componentes críticos
        run: |
          node --check application/public/app.js
          node --check application/server/app.mjs
          node --check application/server/security.mjs
      - name: Pruebas sintéticas de autenticación, SQL, XP, Moodle y permisos
        run: npm test

  native-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Impedir configuración de proyecto remoto
        run: |
          test ! -d staging/supabase/.temp
          ! grep -R -l 'lfdmbkzghnwvsapxypvt' staging/supabase
      - name: Iniciar servicios nativos locales
        run: supabase start --workdir ./staging -x realtime,studio,analytics,vector,imgproxy
      - name: Verificar migraciones y seed desde cero
        run: supabase db reset --local --workdir ./staging

  edge-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testear gateway Edge sin servicios ni secretos
        run: deno test --allow-none staging/supabase/functions/mi-movida-api/index_test.ts
