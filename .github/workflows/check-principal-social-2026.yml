name: Verify main Movida SST social image
on:
  push:
    paths:
      - .github/workflows/check-principal-social-2026.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live homepage Open Graph and sharp image
        run: |
          set -euo pipefail
          SITE="https://www.movidasst.com/"
          IMG="https://www.movidasst.com/og-movida-sst-casimiro-casimira-20261021-nitida.jpg"
          for n in $(seq 1 12); do
            curl -fsSL --max-time 20 -A 'WhatsApp/2.26.21.10' "${SITE}?socialcheck=20261021-nitida-${n}" -o /tmp/site.html
            if grep -Fq '<meta property="og:image" content="'"${IMG}"'">' /tmp/site.html; then break; fi
            [ "${n}" -ne 12 ] || { echo 'New metadata not available'; exit 1; }
            sleep 5
          done
          grep -Fq '<meta property="og:image:width" content="1200">' /tmp/site.html
          grep -Fq '<meta property="og:image:height" content="630">' /tmp/site.html
          grep -Fq '<meta name="twitter:image" content="'"${IMG}"'">' /tmp/site.html
          curl -fsSL --max-time 25 -A 'WhatsApp/2.26.21.10' -D /tmp/headers.txt "${IMG}" -o /tmp/og.jpg
          grep -Ei '^HTTP/|^content-type:|^content-length:' /tmp/headers.txt | tail -n 8
          file /tmp/og.jpg
          file --mime-type /tmp/og.jpg | grep -Fq 'image/jpeg'
          file /tmp/og.jpg | grep -q '1200x630'
          test "$(wc -c </tmp/og.jpg)" -gt 250000
          test "$(wc -c </tmp/og.jpg)" -lt 350000
          echo "MOVIDA_OG_HTTP_OK_IMAGE_BYTES=$(wc -c </tmp/og.jpg)"
          echo "MOVIDA_SOCIAL_PREVIEW_VERIFIED=YES"
